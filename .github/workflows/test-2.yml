  name: Markdown Only Check                                                                                                                             
  on: pull_request                                                                                                                                      
                                                                                                                                                        
  jobs:
    report:                                                                                                                                             
      runs-on: ubuntu-latest                                                                                                                            
      permissions:                                                                                                                                      
        checks: write                                                                                                                                   
      steps:
        - uses: LouisBrunner/checks-action@v2
          with:                                                                                                                                         
            token: ${{ secrets.GITHUB_TOKEN }}
            name: "Coverage Report"                                                                                                                     
            conclusion: success                                                                                                                       
            output: |
              {"summary":"## Coverage Report\n\n**85%** line coverage across 3 files.\n\n| File | Coverage |\n|------|----------|\n| src/index.ts | 92% |\n| src/utils.ts | 78% |\n| src/helpers.ts | 85% |","text":"### Detailed Results\n\nAll tests passed.\n\n```\nTest Suites: 3 passed, 3 total\nTests:  12 passed, 12 total\nTime: 2.347s\n```"}
